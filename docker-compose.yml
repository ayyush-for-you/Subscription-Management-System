services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brightloop
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://brightloop:brightloop@postgres:5432/brightloop
      JWT_SECRET: local-development-only-secret-change-me
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3001:3001"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  postgres_data:
